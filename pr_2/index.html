<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <img src="assets/Header.png" alt="PetWorld Logo">
                <span>PetWorld</span>
            </div>
            <div class="header-action">
                <a href="#" class="btn btn-primary">Get Started</a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container hero-container">
                <div class="hero-content">
                    <h1 class="hero-title">Care & Love <br><span>For Your Pets</span></h1>
                    <p class="hero-text">
                        Discover the best professional care, premium nutrition, and accessories to keep your furry friends happy and healthy every single day.
                    </p>
                    <div class="pet-buttons">
                        <a href="#" class="btn btn-primary">Explore Now</a>
                        <a href="#" class="btn btn-secondary">Watch Video</a>
                    </div>
                </div>
                <div class="pet-image">
                    <img src="assets/Video.png" alt="Happy pets illustration">
                    <img src="assets/Logos.png" alt="Happy pets illustration">
                    <img src="assets/Features.png" alt="Happy pets illustration">
                </div>
            </div>
        </section>

        <section class="features">
            <div class="container">
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
        </div>
    </footer>

</body>
</html>
