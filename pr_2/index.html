<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Landing Page</title>
    <!-- Підключення шрифту Poppins з Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Шапка сайту -->
    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <img src="assets/logo.svg" alt="PetWorld Logo">
                <span>PetWorld</span>
            </div>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="#" class="nav-link">Home</a></li>
                    <li><a href="#" class="nav-link">Services</a></li>
                    <li><a href="#" class="nav-link">About Us</a></li>
                    <li><a href="#" class="nav-link">Contact</a></li>
                </ul>
            </nav>
            <div class="header-action">
                <a href="#" class="btn btn-primary">Get Started</a>
            </div>
        </div>
    </header>

    <!-- Основний контент -->
    <main>
        <!-- Секція Hero (Парний варіант: Pets) -->
        <section class="hero">
            <div class="container hero-container">
                <div class="hero-content">
                    <h1 class="hero-title">Care & Love <br><span>For Your Pets</span></h1>
                    <p class="hero-text">
                        Discover the best professional care, premium nutrition, and accessories to keep your furry friends happy and healthy every single day.
                    </p>
                    <div class="hero-buttons">
                        <a href="#" class="btn btn-primary">Explore Now</a>
                        <a href="#" class="btn btn-secondary">Watch Video</a>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="assets/hero-pets.png" alt="Happy pets illustration">
                </div>
            </div>
        </section>

        <!-- Секція переваг / послуг (Features) -->
        <section class="features">
            <div class="container">
                <!-- Картки послуг/переваг -->
            </div>
        </section>
    </main>

    <!-- Підвал сайту -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 PetWorld. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
