<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <main>
    <!-- 1. Головний екран (Hero) із заголовком, текстом та кнопками -->
    <section class="hero">
        <div class="container hero-container">
            <h1 class="hero-title">Pet Store & Beyond</h1>
            <p class="hero-text">Fresh ingredients slowly cooked into our super delicious food. Available in a range of delicious flavors, delivered to your door.</p>
            <div class="pet-buttons">
                <a href="#" class="btn btn-primary">Get Started</a>
            </div>
        </div>
    </section>

    <section class="video-section">
        <div class="container">
            <img src="assets/Video.png" alt="Video preview">
        </div>
    </section>
    <section class="logos-section">
        <div class="container">
            <img src="assets/Logos.png" alt="Partner logos">
        </div>
    </section>
    <section class="features">
        <div class="container">
            <img src="assets/Features.png" alt="Features and products">
        </div>
    </section>
</main>

    <footer class="footer">
        <div class="container">
        </div>
    </footer>

</body>
</html>
